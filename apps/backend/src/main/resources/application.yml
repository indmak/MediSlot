# ===== 公共配置（所有 profile 共享） =====
spring:
  application:
    name: medislot
  profiles:
    # 未显式指定 profile 时默认走 dev（本地开发）
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: true
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
  web:
    locale: zh_CN
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  error:
    whitelabel:
      enabled: false

# 应用自定义配置
medislot:
  seed:
    # 是否写入演示数据（科室/医生/患者/排班）。dev 与 docker 默认开启。
    enabled: false
  admin:
    # 内置管理员账号（幂等创建）；可用环境变量覆盖：MEDISLOT_ADMIN_PHONE / MEDISLOT_ADMIN_PASSWORD
    phone: 13000000000
    password: admin123
  payment:
    # 未支付订单的有效期（分钟），超时自动作废并释放号源
    expiry-minutes: 30
  upload:
    # 附件存储目录（相对工作目录；容器内为 /app/uploads）
    dir: uploads
  kb:
    # 知识库原始文档目录
    dir: uploads/kb
  rag:
    # RAG 基础设施总开关（关掉则不创建向量库，测试环境关闭）
    enabled: false
    # 向量维度，须与嵌入模型一致（智谱 embedding-3 = 1024）
    dimensions: 1024

logging:
  level:
    com.medislot: INFO
