# ===== 本地开发 =====
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/medislot_db?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

# 是否写入演示数据（科室 / 医生 / 患者 / 排班）
medislot:
  seed:
    enabled: true

logging:
  level:
    com.medislot: DEBUG
