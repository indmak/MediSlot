# ===== 本地开发 =====
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medislot_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

# 是否写入演示数据（科室 / 医生 / 患者 / 排班）
medislot:
  seed:
    enabled: true
  rag:
    enabled: true

logging:
  level:
    com.medislot: DEBUG
