<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('两步验证')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<main class="content-wrapper content-wrapper--narrow">
    <div class="card auth-card">
        <header class="page-header">
            <h1 class="page-title">两步验证</h1>
            <p class="page-subtitle">请输入身份验证器（腾讯身份验证器）中的 6 位动态码</p>
        </header>

        <div class="alert alert-danger" th:if="${param.error}">动态码错误或已过期，请重试</div>

        <form th:action="@{/login/2fa}" method="post">
            <div class="mb-4">
                <label class="form-label" for="code">动态码</label>
                <input class="form-control" id="code" name="code" type="text" inputmode="numeric"
                       pattern="[0-9]{6}" maxlength="6" placeholder="6 位数字" required autofocus>
            </div>
            <button class="btn btn-primary w-100" type="submit">验证并登录</button>
        </form>

        <form th:action="@{/logout}" method="post" class="mt-3 text-center">
            <button class="btn btn-link" type="submit">返回登录</button>
        </form>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
