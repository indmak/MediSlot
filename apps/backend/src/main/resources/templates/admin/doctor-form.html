<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('编辑医生')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<nav th:replace="~{layout :: adminNav('doctors')}"></nav>

<main class="content-wrapper content-wrapper--narrow">
    <header class="page-header">
        <h1 class="page-title">编辑医生</h1>
    </header>

    <div class="card form-card">
        <form th:action="@{/admin/doctors/{id}(id=${doctorId})}" th:object="${form}" method="post" class="row g-3">
            <div class="col-12 col-md-6">
                <label class="form-label" for="name">姓名</label>
                <input class="form-control" id="name" type="text" th:field="*{name}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="phone">手机号（登录名，不可修改）</label>
                <input class="form-control" id="phone" type="text" th:field="*{phone}" readonly>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="departmentId">科室</label>
                <select class="form-select" id="departmentId" th:field="*{departmentId}" th:errorclass="is-invalid">
                    <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">内科</option>
                </select>
                <div class="invalid-feedback" th:errors="*{departmentId}"></div>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="title">职称</label>
                <input class="form-control" id="title" type="text" th:field="*{title}">
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="registrationFee">挂号费（元）</label>
                <input class="form-control" id="registrationFee" type="number" step="0.01" min="0"
                       th:field="*{registrationFee}" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{registrationFee}"></div>
            </div>
            <div class="col-12">
                <label class="form-label" for="bio">简介</label>
                <textarea class="form-control" id="bio" rows="3" th:field="*{bio}"></textarea>
            </div>
            <div class="col-12">
                <div class="form-actions">
                    <a class="btn btn-outline-primary" th:href="@{/admin/doctors}">返回</a>
                    <button class="btn btn-primary" type="submit">保存</button>
                </div>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
