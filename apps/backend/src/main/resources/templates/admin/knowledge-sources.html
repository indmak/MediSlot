<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('知识库来源')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<nav th:replace="~{layout :: adminNav('sources')}"></nav>

<main class="content-wrapper">
    <header class="page-header">
        <h1 class="page-title">知识库来源</h1>
        <p class="page-subtitle">管理知识来源：人工上传、诊前咨询自动归档、外部接口（下一阶段）</p>
    </header>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="card">
        <table class="table ms-table">
            <thead>
            <tr>
                <th>来源</th><th>类型</th><th>说明</th><th>文档数</th><th>上次同步</th><th>状态</th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${sources}">
                <td th:text="${s.name}">人工上传</td>
                <td th:text="${s.type.label}">人工上传</td>
                <td th:text="${s.description}">—</td>
                <td th:text="${counts.get(s.id)}">0</td>
                <td th:text="${s.lastSyncAt != null ? #temporals.format(s.lastSyncAt,'MM-dd HH:mm') : '-'}">-</td>
                <td>
                    <span class="badge-status"
                          th:classappend="${s.enabled ? 'badge-completed' : 'badge-cancelled'}"
                          th:text="${s.enabled ? '已启用' : '已停用'}">已启用</span>
                    <div class="text-muted" th:if="${s.lastSyncMessage != null}" th:text="${s.lastSyncMessage}"></div>
                </td>
                <td class="text-end">
                    <form th:if="${s.type.name() == 'CONSULTATION'}"
                          th:action="@{/admin/knowledge/sources/consultation/sync}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-primary" type="submit">立即同步</button>
                    </form>
                    <form th:if="${s.type.name() != 'EXTERNAL_API'}"
                          th:action="@{/admin/knowledge/sources/{id}/toggle(id=${s.id})}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-primary" type="submit"
                                th:text="${s.enabled ? '停用' : '启用'}">停用</button>
                    </form>
                    <span th:if="${s.type.name() == 'EXTERNAL_API'}" class="text-muted">下一阶段开放配置</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <p class="page-subtitle" style="margin-top:12px">
        诊前咨询来源会把「已关闭」会话（脱敏后）自动归档，标记为<b>私有</b>，仅医生 / 管理员 / 维护员在知识库问答中可见；
        患者侧诊前咨询检索增强不会命中。<br>
        自动同步开关与最小消息数在 <a th:href="@{/admin/settings}">设置中心</a>：
        <code>kb.consultation.auto-sync</code>、<code>kb.consultation.min-messages</code>。
        <a th:href="@{/admin/knowledge}">← 返回知识库</a>
    </p>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
