<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('确认预约')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<main class="content-wrapper content-wrapper--narrow">
    <header class="page-header">
        <h1 class="page-title">确认预约</h1>
    </header>

    <section class="card summary-card">
        <h2 class="section-title" th:text="${schedule.doctor.name}">张明华</h2>
        <p class="doctor-meta">
            <span th:text="${schedule.doctor.title}">副主任医师</span>
            <span class="dot">·</span>
            <span th:text="${schedule.doctor.department.name}">内科</span>
        </p>
        <p class="summary-line"
           th:text="${#temporals.format(schedule.date,'yyyy年M月d日 EEEE')} + ' · ' + ${#temporals.format(schedule.startTime,'HH:mm')} + ' - ' + ${#temporals.format(schedule.endTime,'HH:mm')}">
            2026年10月15日 星期三 · 09:00 - 09:30
        </p>
        <span class="badge-status badge-available" th:text="${'剩余 ' + schedule.remaining + ' 个号'}">剩余 3 个号</span>
        <p class="summary-line" th:text="${'挂号费 ¥' + schedule.doctor.registrationFee}">挂号费 ¥30.00</p>
    </section>

    <form class="card form-card" th:action="@{/appointments}" th:object="${form}" method="post">
        <input type="hidden" th:field="*{scheduleId}">
        <div class="mb-3">
            <label class="form-label" for="patientName">就诊人姓名</label>
            <input class="form-control" id="patientName" type="text"
                   th:field="*{patientName}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{patientName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="patientPhone">手机号</label>
            <input class="form-control" id="patientPhone" type="text"
                   th:field="*{patientPhone}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{patientPhone}"></div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="reason">就诊原因（选填）</label>
            <textarea class="form-control" id="reason" rows="3" th:field="*{reason}"></textarea>
        </div>
        <div class="form-actions">
            <a class="btn btn-outline-primary" th:href="@{/doctors/{id}(id=${schedule.doctor.id})}">返回</a>
            <button class="btn btn-primary" type="submit">确认预约</button>
        </div>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
