<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('我的预约')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<main class="content-wrapper">
    <header class="page-header">
        <h1 class="page-title">我的预约</h1>
    </header>

    <div class="alert alert-success" th:if="${message}" th:text="${message}">支付成功</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">支付失败</div>

    <ul class="nav segmented" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-pending"
                    type="button" role="tab">
                待就诊 <span class="segmented__count" th:text="${pending.size()}">0</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-completed"
                    type="button" role="tab">
                已完成 <span class="segmented__count" th:text="${completed.size()}">0</span>
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-cancelled"
                    type="button" role="tab">
                已取消 <span class="segmented__count" th:text="${cancelled.size()}">0</span>
            </button>
        </li>
    </ul>

    <div class="tab-content">
        <!-- 待就诊 -->
        <div class="tab-pane fade show active" id="tab-pending" role="tabpanel">
            <div th:if="${#lists.isEmpty(pending)}" class="empty-state">
                <i class="bi bi-calendar-x empty-state__icon"></i>
                <p class="empty-state__title">还没有预约记录</p>
                <p class="empty-state__hint">去看看有哪些医生吧</p>
                <a class="btn btn-primary" th:href="@{/doctors}">去找医生</a>
            </div>
            <div class="appt-list" th:unless="${#lists.isEmpty(pending)}">
                <div class="card appt-card" th:each="a : ${pending}">
                    <div class="appt-card__body appt-card__body--wide">
                        <div class="appt-card__name">
                            <span th:text="${a.schedule.doctor.name}">张明华</span>
                            <span class="dot">·</span>
                            <span th:text="${a.schedule.doctor.department.name}">内科</span>
                            <span class="badge-status badge-pending">待就诊</span>
                            <span class="badge-status" th:if="${a.payment != null}"
                                  th:classappend="${a.payment.status.name() == 'PAID' ? 'badge-completed' : 'badge-pending'}"
                                  th:text="${a.payment.status.label}">待支付</span>
                        </div>
                        <div class="appt-card__meta"
                             th:text="${#temporals.format(a.schedule.date,'M月d日 EEE')} + ' ' + ${#temporals.format(a.schedule.startTime,'HH:mm')} + ' - ' + ${#temporals.format(a.schedule.endTime,'HH:mm')}">
                            10月15日 周三 09:00 - 09:30
                        </div>
                        <div class="appt-card__no" th:text="${'预约编号 ' + a.appointmentNo}">预约编号 A20261015-003</div>
                        <div class="appt-card__no" th:text="${'挂号费 ¥' + a.registrationFee}">挂号费 ¥30.00</div>
                    </div>
                    <div class="appt-card__actions">
                        <a class="btn btn-primary btn-sm"
                           th:if="${a.payment != null and a.payment.status.name() == 'UNPAID'}"
                           th:href="@{/payments/{no}(no=${a.payment.paymentNo})}">去支付</a>
                        <form th:action="@{/appointments/{id}/cancel(id=${a.id})}" method="post">
                            <button class="btn btn-danger-outline btn-sm" type="submit">取消预约</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- 已完成 -->
        <div class="tab-pane fade" id="tab-completed" role="tabpanel">
            <div th:if="${#lists.isEmpty(completed)}" class="empty-state">
                <i class="bi bi-journal-check empty-state__icon"></i>
                <p class="empty-state__title">暂无已完成的预约</p>
            </div>
            <div class="appt-list" th:unless="${#lists.isEmpty(completed)}">
                <div class="card appt-card" th:each="a : ${completed}">
                    <div class="appt-card__body appt-card__body--wide">
                        <div class="appt-card__name">
                            <span th:text="${a.schedule.doctor.name}">张明华</span>
                            <span class="badge-status badge-completed">已完成</span>
                        </div>
                        <div class="appt-card__meta"
                             th:text="${#temporals.format(a.schedule.date,'yyyy年M月d日')} + ' ' + ${#temporals.format(a.schedule.startTime,'HH:mm')}">
                            2026年10月15日 09:00
                        </div>
                        <div class="appt-card__no" th:text="${'挂号费 ¥' + a.registrationFee}">挂号费 ¥30.00</div>
                        <div class="appt-card__no" th:if="${a.diagnosisNote != null}"
                             th:text="${'诊断：' + a.diagnosisNote}">诊断：...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 已取消 -->
        <div class="tab-pane fade" id="tab-cancelled" role="tabpanel">
            <div th:if="${#lists.isEmpty(cancelled)}" class="empty-state">
                <i class="bi bi-slash-circle empty-state__icon"></i>
                <p class="empty-state__title">暂无已取消的预约</p>
            </div>
            <div class="appt-list" th:unless="${#lists.isEmpty(cancelled)}">
                <div class="card appt-card" th:each="a : ${cancelled}">
                    <div class="appt-card__body appt-card__body--wide">
                        <div class="appt-card__name">
                            <span th:text="${a.schedule.doctor.name}">张明华</span>
                            <span class="badge-status badge-cancelled">已取消</span>
                            <span class="badge-status" th:if="${a.payment != null}"
                                  th:classappend="${a.payment.status.name() == 'REFUNDED' ? 'badge-full' : 'badge-cancelled'}"
                                  th:text="${a.payment.status.label}">已退款</span>
                        </div>
                        <div class="appt-card__meta"
                             th:text="${#temporals.format(a.schedule.date,'yyyy年M月d日')} + ' ' + ${#temporals.format(a.schedule.startTime,'HH:mm')}">
                            2026年10月15日 09:00
                        </div>
                        <div class="appt-card__no" th:text="${'挂号费 ¥' + a.registrationFee}">挂号费 ¥30.00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
