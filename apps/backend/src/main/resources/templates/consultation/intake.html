<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: head('问诊信息')}"></head>
<body>
<nav th:replace="~{layout :: nav}"></nav>

<main class="content-wrapper content-wrapper--narrow">
    <header class="page-header">
        <h1 class="page-title">完善问诊信息</h1>
        <p class="page-subtitle">结构化填写后，AI 与医生能更快了解您的病情（可随时修改）</p>
    </header>

    <form class="card form-card" th:action="@{/consultations/{id}/intake(id=${conversation.id})}"
          th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label" for="chiefComplaint">主诉（最主要的不适）</label>
            <textarea class="form-control" id="chiefComplaint" rows="2" th:field="*{chiefComplaint}"
                      placeholder="例如：反复咳嗽 3 天"></textarea>
            <div class="invalid-feedback d-block" th:errors="*{chiefComplaint}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label d-block">症状（可多选）</label>
            <label class="form-check form-check-inline" th:each="opt : ${symptomOptions}">
                <input class="form-check-input" type="checkbox" th:field="*{symptoms}" th:value="${opt}">
                <span th:text="${opt}">发热</span>
            </label>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
                <label class="form-label" for="duration">病程（持续多久）</label>
                <input class="form-control" id="duration" type="text" th:field="*{duration}"
                       placeholder="例如：3 天 / 2 周">
                <div class="invalid-feedback d-block" th:errors="*{duration}"></div>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="severity">严重程度</label>
                <select class="form-select" id="severity" th:field="*{severity}">
                    <option value="">请选择</option>
                    <option th:each="s : ${severities}" th:value="${s}" th:text="${s.label}">轻</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="accompanying">伴随症状</label>
            <textarea class="form-control" id="accompanying" rows="2" th:field="*{accompanying}"
                      placeholder="例如：乏力、食欲不振"></textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
                <label class="form-label" for="temperature">体温（℃）</label>
                <input class="form-control" id="temperature" type="number" step="0.1" min="30" max="45"
                       th:field="*{temperature}" placeholder="例如：38.5">
                <div class="invalid-feedback d-block" th:errors="*{temperature}"></div>
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="allergies">过敏史</label>
                <input class="form-control" id="allergies" type="text" th:field="*{allergies}"
                       placeholder="药物/食物过敏">
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
                <label class="form-label" for="pastHistory">既往史</label>
                <input class="form-control" id="pastHistory" type="text" th:field="*{pastHistory}"
                       placeholder="慢性病、手术史等">
            </div>
            <div class="col-12 col-md-6">
                <label class="form-label" for="medications">近期用药</label>
                <input class="form-control" id="medications" type="text" th:field="*{medications}"
                       placeholder="正在服用的药物">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label d-block">危险信号（如有请勾选，医生会优先关注）</label>
            <label class="form-check form-check-inline" th:each="opt : ${redFlagOptions}">
                <input class="form-check-input" type="checkbox" th:field="*{redFlags}" th:value="${opt}">
                <span class="text-danger" th:text="${opt}">胸痛</span>
            </label>
        </div>

        <div class="form-actions">
            <a class="btn btn-outline-primary" th:href="@{/consultations/{id}(id=${conversation.id})}">返回</a>
            <button class="btn btn-primary" type="submit">保存问诊信息</button>
        </div>
    </form>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
