<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="zh-CN">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · MediSlot'">MediSlot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap-override.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/pages.css}">
</head>
<body>

<nav th:fragment="nav" class="ms-nav">
    <div class="content-wrapper ms-nav__inner">
        <a class="ms-brand" th:href="@{/}">MediSlot</a>
        <div class="ms-nav__links">
            <a th:href="@{/doctors}">找医生</a>
            <a th:href="@{/appointments/my}" sec:authorize="hasRole('PATIENT')">我的预约</a>
            <a th:href="@{/doctor/today}" sec:authorize="hasRole('DOCTOR')">今日预约</a>
            <a th:href="@{/admin}" sec:authorize="hasRole('ADMIN')">管理后台</a>
        </div>
        <div class="ms-nav__account">
            <th:block sec:authorize="isAnonymous()">
                <a class="btn btn-sm btn-outline-primary" th:href="@{/login}">登录</a>
                <a class="btn btn-sm btn-primary" th:href="@{/register}">注册</a>
            </th:block>
            <th:block sec:authorize="isAuthenticated()">
                <span class="ms-user" sec:authentication="name">用户</span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-link" type="submit">退出</button>
                </form>
            </th:block>
        </div>
    </div>
</nav>

<!-- 管理后台子导航 -->
<nav th:fragment="adminNav(active)" class="admin-nav" aria-label="管理后台导航">
    <a th:href="@{/admin}" th:classappend="${active == 'dashboard' ? 'active' : ''}">仪表盘</a>
    <a th:href="@{/admin/departments}" th:classappend="${active == 'departments' ? 'active' : ''}">科室</a>
    <a th:href="@{/admin/doctors}" th:classappend="${active == 'doctors' ? 'active' : ''}">医生</a>
    <a th:href="@{/admin/schedules}" th:classappend="${active == 'schedules' ? 'active' : ''}">排班</a>
</nav>

<!-- 医生卡片网格（首页 / 医生列表共用） -->
<div th:fragment="doctorGrid(doctors)" class="row g-3">
    <div class="col-12 col-sm-6 col-lg-4" th:each="doctor : ${doctors}">
        <a class="doctor-card" th:href="@{/doctors/{id}(id=${doctor.id})}">
            <div class="doctor-card__top">
                <div class="doctor-avatar">
                    <img th:if="${doctor.avatarUrl != null}" th:src="${doctor.avatarUrl}" alt="">
                    <span th:unless="${doctor.avatarUrl != null}"
                          th:text="${#strings.substring(doctor.name, 0, 1)}">张</span>
                </div>
                <div>
                    <div class="doctor-name" th:text="${doctor.name}">张明华</div>
                    <div class="doctor-meta">
                        <span th:text="${doctor.title}">副主任医师</span>
                        <span class="dot">·</span>
                        <span th:text="${doctor.departmentName}">心血管内科</span>
                    </div>
                </div>
            </div>
            <div class="doctor-card__stats">
                <span><i class="bi bi-star-fill"></i>
                    <span th:text="${doctor.rating != null ? doctor.rating : '-'}">4.8</span>
                </span>
                <span class="dot">·</span>
                <span>预约 <span th:text="${doctor.appointmentCount}">326</span> 次</span>
            </div>
            <div class="doctor-card__footer">
                <span class="badge-status"
                      th:classappend="${doctor.hasAvailableSlot} ? 'badge-available' : 'badge-full'"
                      th:text="${doctor.hasAvailableSlot ? '今天还有 ' + doctor.remainingToday + ' 个号' : '今日已约满'}">
                    今天还有号
                </span>
            </div>
        </a>
    </div>
    <div class="col-12" th:if="${#lists.isEmpty(doctors)}">
        <div class="empty-state">
            <i class="bi bi-journal empty-state__icon"></i>
            <p class="empty-state__title">暂无可预约医生</p>
            <p class="empty-state__hint">换个科室看看，或稍后再来</p>
        </div>
    </div>
</div>

<footer th:fragment="footer" class="ms-footer">
    <div class="content-wrapper">
        MediSlot — 诊所预约挂号 · Book your slot, skip the wait.
    </div>
</footer>

<script th:fragment="scripts"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
