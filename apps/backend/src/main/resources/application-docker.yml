# ===== 容器环境（docker compose / 云端部署） =====
spring:
  # 从挂载的密钥目录读取属性：/run/secrets/<文件名> -> 属性 <文件名>
  # 例如 /run/secrets/db_password -> 属性 db_password
  #      /run/secrets/medislot/external/deepseek/apikey -> medislot.external.deepseek.apikey
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    # 密码来自挂载文件（见 docker-compose.prod.yml），不经过环境变量
    password: ${db_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      # 表结构稳定后建议切换为 validate，并配合 scripts/init.sql / Flyway
      ddl-auto: update
    show-sql: false
  thymeleaf:
    cache: true

server:
  # 位于宝塔 Nginx 反向代理之后，信任 X-Forwarded-* 头以正确识别 https / 客户端 IP
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # 全站 HTTPS，Cookie 仅经加密连接发送
        secure: true

medislot:
  seed:
    # 云端作为演示/测试环境：写入 5 位不同科室的演示医生 + 内置管理员
    enabled: true
  admin:
    phone: ${MEDISLOT_ADMIN_PHONE:13000000000}
    password: ${MEDISLOT_ADMIN_PASSWORD:admin123}
  upload:
    dir: /app/uploads
  kb:
    dir: /app/uploads/kb
  rag:
    enabled: true
    dimensions: 1024

logging:
  level:
    com.medislot: INFO
    root: INFO
