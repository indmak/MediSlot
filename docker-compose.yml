services:
  db:
    image: pgvector/pgvector:pg16
    container_name: medislot-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER:-medislot}
      POSTGRES_DB: medislot_db
      TZ: Asia/Shanghai
    volumes:
      - medislot-db-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-medislot} -d medislot_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: medislot-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/medislot_db
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-medislot}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

volumes:
  medislot-db-data:
