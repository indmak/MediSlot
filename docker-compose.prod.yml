# =============================================================
# MediSlot 云端部署编排（宝塔面板服务器）
#   - 应用 + 数据库各一个容器
#   - 数据库不对外暴露端口，仅容器网络内可访问
#   - 应用只绑定 127.0.0.1:8080，由宝塔 Nginx 反向代理 + SSL
#   - MySQL 数据落盘到 ./data/mysql，容器重建不丢数据
#
# 密钥注入方式：挂载文件（./secrets -> /run/secrets），**不使用环境变量**，
#   因此 docker inspect / printenv 看不到密码；详见 secrets/README.md。
#
# 使用：
#   1) 按 secrets/README.md 创建 secrets/ 下的密钥文件
#   2) docker compose -f docker-compose.prod.yml up -d --build
#   3) docker compose -f docker-compose.prod.yml logs -f app
# =============================================================
name: medislot

services:
  db:
    image: mysql:8.4
    container_name: medislot-db
    restart: unless-stopped
    environment:
      # 仅传递文件路径，密码值本身来自挂载文件
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: medislot_db
      MYSQL_USER: ${DB_USER:-medislot}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./secrets:/run/secrets:ro
    # 不映射宿主机端口：数据库仅对本编排内的应用容器可见
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: medislot-app:latest
    container_name: medislot-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/medislot_db?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-medislot}
      # 数据库密码来自 configtree（/run/secrets/db_password），不在此处设置
      TZ: Asia/Shanghai
    volumes:
      - ./secrets:/run/secrets:ro
    ports:
      # 仅绑定回环地址，交给宝塔 Nginx 反向代理（避免直接暴露 8080）
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
