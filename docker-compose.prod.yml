# =============================================================
# MediSlot 云端部署编排（宝塔面板服务器）
#   - 应用 + 数据库各一个容器
#   - 数据库不对外暴露端口，仅容器网络内可访问
#   - 应用只绑定 127.0.0.1:8080，由宝塔 Nginx 反向代理 + SSL
#   - MySQL 数据落盘到 ./data/mysql，容器重建不丢数据
#
# 使用：
#   cp .env.prod.example .env.prod          # 修改其中的密码
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.prod -f docker-compose.prod.yml logs -f app
# =============================================================
name: medislot

services:
  db:
    image: mysql:8.4
    container_name: medislot-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: medislot_db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 不映射宿主机端口：数据库仅对本编排内的应用容器可见
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    image: medislot-app:latest
    container_name: medislot-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/medislot_db?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定回环地址，交给宝塔 Nginx 反向代理（避免直接暴露 8080）
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
